<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نوبت توئه</title>
<!-- DigiSarve is the body/heading font for every stage including the very
     first paint (intro) - preloaded so the browser fetches it in parallel
     with CSS parsing instead of discovering it only after styles.css is
     parsed. DigiDerakhshandeh (page-1 name overlay only) is intentionally
     NOT preloaded - it isn't needed until much later. crossorigin is
     required here even though the file is same-origin: font fetches are
     always made in anonymous CORS mode, so omitting it would make the
     browser fetch the file a second time for actual use. -->
<link rel="preload" href="assets/fonts/DigiSarve.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
<!-- Projector/Memory stage styles - tiny (no media), safe to always load;
     see projector.js for why the frame/mask IMAGES only ever fetch when
     the feature is actually turned on. -->
<link rel="stylesheet" href="projector.css">

<style>
/* ===== Final-stage polish only: intentionally isolated from the rest of the project ===== */
#stage-final{
  overflow:hidden;
  isolation:isolate;
}

/* A soft light bloom that arrives before the sentence */
#stage-final::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:min(68vw,760px);
  aspect-ratio:1;
  border-radius:50%;
  pointer-events:none;
  z-index:-1;
  opacity:0;
  transform:translate(-50%,-50%) scale(.58);
  background:
    radial-gradient(circle,
      rgba(199,231,174,.20) 0%,
      rgba(170,211,155,.10) 24%,
      rgba(114,164,126,.035) 47%,
      transparent 70%);
  filter:blur(22px);
}

#stage-final::after{
  content:"✦   ·   ✧   ·   ✦";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.9);
  color:rgba(220,239,202,.0);
  font-size:clamp(13px,1.3vw,20px);
  letter-spacing:1.9em;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  text-shadow:
    0 0 12px rgba(213,237,194,.28),
    0 0 28px rgba(184,222,166,.18);
}

/* Keep Claude's layout, but give the ending its own readable width. */
#stage-final .scene-text{
  position:relative;
  z-index:2;
  width:min(88vw,980px);
  margin-inline:auto;
  text-align:center;
}

#stage-final .final-message{
  margin:0;
  opacity:0;
  filter:blur(15px);
  transform:translateY(16px) scale(.985);
  color:#f6f4ed;
  text-wrap:balance;
  text-shadow:
    0 1px 0 rgba(0,0,0,.12),
    0 0 22px rgba(212,231,197,.08);
}
#stage-final .scene-text{
  transform:translateY(var(--nur-final-y));
}
#stage-final .final-message-main{
  font-size:var(--nur-final-font-size);
  font-weight:700;
  line-height:1.5;
  word-spacing:var(--nur-final-word-spacing);
}
#stage-final .final-message-sub{
  margin-top:22px;
  font-size:clamp(18px,2vw,26px);
  font-weight:500;
  line-height:1.9;
  color:#eae8dd;
  word-spacing:var(--nur-final-word-spacing);
}

/* Signature - revealed by app.js a few seconds after the main message,
   with a very slow, gentle twinkle once visible (never a pulse/flash). */
#stage-final .final-signature{
  margin:0;
  margin-top:var(--nur-final-sig-y);
  opacity:0;
  font-size:var(--nur-final-sig-font-size);
  font-weight:500;
  color:#e8cf8a;
  text-shadow:0 0 10px rgba(232,207,138,.3);
  transition:opacity 2.4s ease;
  word-spacing:var(--nur-final-sig-word-spacing);
}
#stage-final .final-signature.visible{
  opacity:.78;
  animation:signatureTwinkle 6s ease-in-out 2.4s infinite;
}
@keyframes signatureTwinkle{
  0%,100%{opacity:.78; text-shadow:0 0 8px rgba(232,207,138,.22)}
  50%{opacity:.95; text-shadow:0 0 14px rgba(232,207,138,.4)}
}

/* Only runs when the existing app makes the final stage active. */
#stage-final.active::before{
  animation:finalLightBloom 4.8s cubic-bezier(.22,.75,.2,1) both;
}

#stage-final.active::after{
  animation:finalSparkle 5.2s ease both;
}

#stage-final.active .final-message{
  animation:finalMessageReveal 3.2s cubic-bezier(.2,.72,.18,1) .55s both;
}

@keyframes finalLightBloom{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.48);
    filter:blur(32px);
  }
  35%{
    opacity:.78;
  }
  72%{
    opacity:.42;
    transform:translate(-50%,-50%) scale(1.03);
    filter:blur(24px);
  }
  100%{
    opacity:.20;
    transform:translate(-50%,-50%) scale(1.12);
    filter:blur(28px);
  }
}

@keyframes finalSparkle{
  0%,14%{
    opacity:0;
    color:rgba(220,239,202,0);
    transform:translate(-50%,-50%) scale(.86);
  }
  40%{
    opacity:.72;
    color:rgba(220,239,202,.62);
  }
  68%{
    opacity:.28;
    transform:translate(-50%,-50%) scale(1.08);
  }
  100%{
    opacity:0;
    color:rgba(220,239,202,0);
    transform:translate(-50%,-50%) scale(1.16);
  }
}

@keyframes finalMessageReveal{
  0%{
    opacity:0;
    filter:blur(17px);
    transform:translateY(18px) scale(.98);
    letter-spacing:.025em;
  }
  42%{
    opacity:.72;
    filter:blur(4px);
  }
  100%{
    opacity:1;
    filter:blur(0);
    transform:translateY(0) scale(1);
    letter-spacing:0;
  }
}

@media (max-width:760px){
  #stage-final .scene-text{
    width:88vw;
  }
  #stage-final .final-message-main{
    font-size:clamp(22px,6vw,30px);
    line-height:1.45;
  }
  #stage-final .final-message-sub{
    margin-top:16px;
    font-size:clamp(16px,4.4vw,20px);
    line-height:1.8;
  }
  #stage-final .final-signature{
    margin-top:64px;
    font-size:13px;
  }
  #stage-final::after{
    letter-spacing:1.15em;
  }
}

/* Respect accessibility settings instead of forcing animation on everyone. */
@media (prefers-reduced-motion:reduce){
  #stage-final.active::before,
  #stage-final.active::after,
  #stage-final.active .final-message{
    animation-duration:.01ms !important;
    animation-delay:0ms !important;
  }
  #stage-final .final-signature{
    transition-duration:.01ms;
  }
  #stage-final .final-signature.visible{
    animation:none;
    opacity:.85;
  }
}
</style>


<style>
/* ===== Countdown polish only =====
   Scoped entirely to #stage-countdown so the rest of the project stays untouched. */

#stage-countdown{
  position:relative;
  isolation:isolate;
  overflow:hidden;
}

/* Controlled exit: app.js adds this class the instant the countdown
   reaches 1 and freezes the number - the stage stays fully active,
   centered and laid out exactly as before, and ONLY opacity/blur/scale
   animate. Only once this finishes does app.js hand off to the normal
   stage-swap (show()), so the final stage never enters while this is
   still visible and the number never has a frame without full centering. */
#stage-countdown.exiting{
  animation:countdownExit 900ms ease forwards;
}
@keyframes countdownExit{
  from{opacity:1; filter:blur(0); transform:scale(1)}
  to{opacity:0; filter:blur(20px); transform:scale(.97)}
}
@media (prefers-reduced-motion:reduce){
  #stage-countdown.exiting{
    animation-duration:.01ms;
  }
}

/* Wide, very soft magical aura */
#stage-countdown::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:min(64vw,720px);
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.78);
  pointer-events:none;
  z-index:-2;
  opacity:0;
  background:
    radial-gradient(circle,
      rgba(202,232,177,.16) 0%,
      rgba(164,210,160,.075) 27%,
      rgba(108,162,140,.025) 51%,
      transparent 72%);
  filter:blur(22px);
}

/* Thin orbit / ripple around the number */
#stage-countdown::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:clamp(210px,25vw,330px);
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.70);
  pointer-events:none;
  z-index:-1;
  opacity:0;
  border:1px solid rgba(218,239,196,.18);
  box-shadow:
    0 0 26px rgba(196,229,175,.08),
    inset 0 0 28px rgba(196,229,175,.035);
}

#stage-countdown.active::before{
  animation:countdownAura 4.8s ease-in-out infinite;
}

#stage-countdown.active::after{
  animation:countdownOrbit 3.7s cubic-bezier(.4,0,.2,1) infinite;
}

/* Reuse Claude's existing glow element as a tiny living star */
#stage-countdown .countdown-glow{
  position:absolute !important;
  left:50% !important;
  top:50% !important;
  width:12px !important;
  height:12px !important;
  margin:0 !important;
  border-radius:50%;
  transform:translate(-50%,-50%) translateY(-112px);
  background:#e3f2cb !important;
  opacity:.48;
  filter:blur(.2px);
  box-shadow:
    0 0 8px rgba(228,246,207,.72),
    0 0 22px rgba(196,231,177,.42),
    0 0 52px rgba(159,210,158,.17);
  pointer-events:none;
  z-index:0;
}

#stage-countdown.active .countdown-glow{
  animation:countdownStar 3.2s ease-in-out infinite;
}

/* Main number: intentionally much larger and more important */
#stage-countdown .countdown-number{
  position:relative;
  z-index:2;
  min-width:2.4ch;
  text-align:center;
  font-size:clamp(108px,12vw,184px) !important;
  line-height:.92 !important;
  font-weight:600 !important;
  letter-spacing:-.055em;
  font-variant-numeric:tabular-nums;
  color:#f5f3e8 !important;
  text-shadow:
    0 0 20px rgba(231,244,216,.11),
    0 0 52px rgba(179,219,164,.075);
  transform-origin:center;
  will-change:transform,opacity,filter;
}

/* Re-triggered by the tiny JS observer whenever the digit changes */
#stage-countdown .countdown-number.tick-magic{
  animation:magicalTick .82s cubic-bezier(.19,.78,.22,1) both;
}

#stage-countdown .countdown-label{
  position:relative;
  z-index:2;
  margin-top:26px !important;
  font-size:clamp(20px,1.8vw,29px) !important;
  line-height:1.5 !important;
  font-weight:500 !important;
  color:rgba(238,241,232,.74) !important;
  letter-spacing:.01em;
  text-shadow:0 0 18px rgba(202,228,184,.07);
}

/* Reserve a fixed-width slot for the dots so "در حال ارسال" itself never
   shifts as they cycle - only the dots grow/shrink inside this slot,
   right-aligned within it so they always sit flush against the phrase
   (its RTL-isolated sibling) and grow away from it. */
#stage-countdown .countdown-dots{
  display:inline-block;
  min-width:1.6em;
  text-align:right;
}

#stage-countdown.active .countdown-label{
  animation:labelBreath 3.2s ease-in-out infinite;
}

@keyframes magicalTick{
  0%{
    opacity:.18;
    filter:blur(13px);
    transform:translateY(8px) scale(.86);
    text-shadow:
      0 0 10px rgba(236,248,222,.10),
      0 0 22px rgba(184,226,168,.06);
  }
  32%{
    opacity:.92;
    filter:blur(2.5px);
    transform:translateY(-2px) scale(1.075);
    text-shadow:
      0 0 26px rgba(235,248,216,.22),
      0 0 68px rgba(177,221,161,.16);
  }
  62%{
    opacity:1;
    filter:blur(0);
    transform:translateY(0) scale(1.025);
  }
  100%{
    opacity:1;
    filter:blur(0);
    transform:translateY(0) scale(1);
  }
}

@keyframes countdownAura{
  0%,100%{
    opacity:.22;
    transform:translate(-50%,-50%) scale(.76);
    filter:blur(27px);
  }
  50%{
    opacity:.65;
    transform:translate(-50%,-50%) scale(1.02);
    filter:blur(20px);
  }
}

@keyframes countdownOrbit{
  0%{
    opacity:.08;
    transform:translate(-50%,-50%) scale(.72);
  }
  47%{
    opacity:.40;
    transform:translate(-50%,-50%) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.17);
  }
}

@keyframes countdownStar{
  0%,100%{
    opacity:.28;
    transform:translate(-50%,-50%) translateY(-112px) scale(.68);
  }
  50%{
    opacity:.92;
    transform:translate(-50%,-50%) translateY(-112px) scale(1.18);
  }
}

@keyframes labelBreath{
  0%,100%{opacity:.60}
  50%{opacity:.88}
}

@media (max-width:760px){
  #stage-countdown .countdown-number{
    font-size:clamp(92px,28vw,142px) !important;
  }
  #stage-countdown .countdown-label{
    margin-top:22px !important;
    font-size:clamp(18px,5vw,24px) !important;
  }
  #stage-countdown::after{
    width:clamp(190px,58vw,280px);
  }
  #stage-countdown .countdown-glow{
    transform:translate(-50%,-50%) translateY(-92px);
  }
  #stage-countdown.active .countdown-glow{
    animation:countdownStarMobile 3.2s ease-in-out infinite;
  }
}

@keyframes countdownStarMobile{
  0%,100%{
    opacity:.28;
    transform:translate(-50%,-50%) translateY(-92px) scale(.68);
  }
  50%{
    opacity:.92;
    transform:translate(-50%,-50%) translateY(-92px) scale(1.18);
  }
}

@media (prefers-reduced-motion:reduce){
  #stage-countdown.active::before,
  #stage-countdown.active::after,
  #stage-countdown.active .countdown-glow,
  #stage-countdown.active .countdown-label,
  #stage-countdown .countdown-number.tick-magic{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }
}
</style>

</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>
<div class="nur-pulse-overlay" aria-hidden="true"></div>

<main class="wrap">

  <!-- 1. INTRO -->
  <section class="stage active" id="stage-intro" data-stage>
    <div class="scene-text">
      <p class="greeting">درود <bdi class="handle" id="introHandle">ArioPlay</bdi></p>
      <div class="scene-body" id="introBody"></div>
    </div>
    <div class="scene-actions">
      <button class="btn btn-primary" id="toBeforeOpen">ادامه می‌دم</button>
      <button class="btn btn-ghost" id="toLeaving">رهاش می‌کنم</button>
    </div>
  </section>

  <!-- LEAVING (soft ending) -->
  <section class="stage" id="stage-leaving" data-stage>
    <div class="scene-text">
      <p>مراقب خودت باش، موفق باشی.</p>
    </div>
  </section>

  <!-- 2. BEFORE OPENING -->
  <section class="stage" id="stage-before-open" data-stage>
    <div class="scene-text small">
      <p class="greeting" id="envelopeGreeting"></p>
      <p id="envelopeInstruction"></p>
    </div>
    <div class="floating-scene" id="openEnvelope" role="button" tabindex="0" aria-label="باز کردن نامه">
      <img class="envelope-img" data-src="assets/envelope.webp" width="1448" height="1086" decoding="async" alt="پاکت نامه دست‌ساز دال‌وی">
    </div>
  </section>

  <!-- 3 / 4 / 5. THE LETTER (three baked pages, one physical card, soft crossfade between them) -->
  <section class="stage" id="stage-letter" data-stage>
    <div class="letter-stage-inner">
      <div class="letter-flipper" id="letterFlipper" data-active="1">
        <div class="letter-face page1">
          <img class="note-img" id="notePage1Img" data-default-src="assets/note-page1.webp" width="653" height="1080" decoding="async" alt="نامه - صفحه ۱">
          <div class="note-field field-name-overlay" id="letterNameOverlay"></div>
          <div class="note-field letter-body" id="letterBody1"></div>
          <div class="note-field letter-signature" id="letterSignature1"></div>
          <div class="note-field letter-pagenum" id="letterPageNum1"></div>
          <button class="note-next-btn" id="toPage2">صفحه‌ی بعد</button>
        </div>
        <div class="letter-face page2">
          <img class="note-img" id="notePage2Img" data-default-src="assets/note-page2.webp" width="653" height="1080" decoding="async" alt="نامه - صفحه ۲">
          <div class="note-field letter-body" id="letterBody2"></div>
          <div class="note-field letter-signature" id="letterSignature2"></div>
          <div class="note-field letter-pagenum" id="letterPageNum2"></div>
          <button class="note-next-btn" id="toPage3">صفحه‌ی بعد</button>
        </div>
        <div class="letter-face page3">
          <img class="note-img" id="notePage3Img" data-default-src="assets/note-page3.webp" width="653" height="1080" decoding="async" alt="نامه - صفحه ۳">
          <div class="note-field letter-body" id="letterBody3"></div>
          <div class="note-field letter-signature" id="letterSignature3"></div>
          <div class="note-field letter-pagenum" id="letterPageNum3"></div>
          <button class="note-next-btn" id="toCountdown">دریافت نور</button>
        </div>
      </div>
    </div>
  </section>

  <!-- COUNTDOWN — the light being sent -->
  <section class="stage" id="stage-countdown" data-stage>
    <div class="countdown-glow" aria-hidden="true"></div>
    <div class="countdown-number" id="countdownNumber">30</div>
    <div class="countdown-label"><bdi>در حال ارسال</bdi><bdi class="countdown-dots" id="countdownDots" aria-hidden="true"></bdi></div>
  </section>

  <!-- PROJECTOR / MEMORY — optional, only shown when config.projector.enabled
       is true (see app.js). Never receives any media until app.js actually
       calls NUR_PROJECTOR.start(), so this markup alone costs nothing when
       the feature is off. -->
  <section class="stage" id="stage-projector" data-stage>
    <p class="proj-title" id="projTitle"></p>
    <figure class="memory-frame" id="memoryFrame">
      <div class="frame-media">
        <div class="media-layer" data-layer="0"></div>
        <div class="media-layer" data-layer="1"></div>
        <div class="projector-vignette"></div>
        <div class="proj-ambient-glow" aria-hidden="true"></div>
        <svg class="vhs-layer vhs-grain-layer" aria-hidden="true" focusable="false">
          <filter id="vhsGrainFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="21" result="n"/>
            <feColorMatrix in="n" type="saturate" values="0"/>
          </filter>
          <rect width="100%" height="100%" filter="url(#vhsGrainFilter)"/>
        </svg>
        <svg class="vhs-layer vhs-noise-layer" aria-hidden="true" focusable="false">
          <filter id="vhsNoiseFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.12 0.9" numOctaves="2" seed="77" result="n"/>
            <feColorMatrix in="n" type="saturate" values="0"/>
          </filter>
          <rect width="100%" height="100%" filter="url(#vhsNoiseFilter)"/>
        </svg>
        <svg class="vhs-layer vhs-dust-layer" aria-hidden="true" focusable="false">
          <filter id="vhsDustFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="133" result="n"/>
            <feColorMatrix in="n" type="saturate" values="0" result="gray"/>
            <feComponentTransfer in="gray">
              <feFuncA type="discrete" tableValues="0 0 0 0 0 0 0 1"/>
            </feComponentTransfer>
          </filter>
          <rect width="100%" height="100%" filter="url(#vhsDustFilter)"/>
        </svg>
        <div class="vhs-vignette-layer"></div>
        <!-- Single state-driven overlay (projector.js's state machine) -
             preplay / loading / stalled / ended-waiting-for-manual-continue
             all live here as one element instead of scattered buttons, so
             there is exactly one place that can go stale and exactly one
             stacking problem to get right (see projector.css). -->
        <div class="proj-gate" id="projGate">
          <p class="proj-gate-text" id="projGateText"></p>
          <button type="button" class="proj-gate-btn" id="projPlayBtn"></button>
          <div class="proj-gate-actions" id="projGateActions">
            <button type="button" class="proj-gate-link" id="projRetryBtn">دوباره تلاش کن</button>
            <button type="button" class="proj-gate-link" id="projSkipBtn">ادامه بدون فیلم</button>
          </div>
          <button type="button" class="proj-gate-btn proj-gate-btn--continue" id="projContinueBtn">ادامه</button>
        </div>
      </div>
      <img class="frame-overlay" id="projFrameOverlay" alt="">
    </figure>
    <p class="proj-caption" id="projCaption"></p>
  </section>

  <!-- FINAL -->
  <section class="stage" id="stage-final" data-stage>
    <div class="scene-text">
      <p class="final-message final-message-main" id="finalMain"></p>
      <p class="final-message final-message-sub" id="finalSub"></p>
      <p class="final-signature" id="finalSignature"></p>
    </div>
  </section>

</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="projector.js"></script>
<script src="admin-panel.js"></script>

</body>
</html>
