<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نوبت توئه</title>
<!-- DigiSarve is the body/heading font for every stage including the very
     first paint (intro) - preloaded so the browser fetches it in parallel
     with CSS parsing instead of discovering it only after styles.css is
     parsed. DigiDerakhshandeh (page-1 name overlay only) is intentionally
     NOT preloaded - it isn't needed until much later. crossorigin is
     required here even though the file is same-origin: font fetches are
     always made in anonymous CORS mode, so omitting it would make the
     browser fetch the file a second time for actual use. -->
<link rel="preload" href="assets/fonts/DigiSarve.ttf" as="font" type="font/ttf" crossorigin>
<!-- ?v= cache-busts styles.css/projector.css/config.js/app.js/projector.js/
     admin-panel.js as ONE unit (GitHub Pages' CDN caches each file for up
     to 10 minutes independently - Cache-Control: max-age=600 - so right
     after a deploy, different visitors/edge nodes can serve mismatched
     combinations, e.g. this index.html paired with a stale cached app.js
     from before a fix, silently reintroducing an already-fixed bug for a
     few minutes. Confirmed via response headers, not guessed). Bump
     NUR_ASSET_VERSION below on every deploy that touches any of these 6
     files - a fresh query string is a cache key GitHub/browsers have
     never seen, so it's always fetched from origin, never an old cached
     copy, and every visitor's index.html always loads ITS OWN matching
     version of everything, never a mix. -->
<link rel="stylesheet" href="styles.css?v=20260917-7">
<!-- Projector/Memory stage styles - tiny (no media), safe to always load;
     see projector.js for why the frame/mask IMAGES only ever fetch when
     the feature is actually turned on. -->
<link rel="stylesheet" href="projector.css?v=20260917-7">

<style>
/* ===== Final-stage polish only: intentionally isolated from the rest of the project ===== */
#stage-final{
  overflow:hidden;
  isolation:isolate;
}

/* A soft light bloom that arrives before the sentence */
#stage-final::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:min(68vw,760px);
  aspect-ratio:1;
  border-radius:50%;
  pointer-events:none;
  z-index:-1;
  opacity:0;
  transform:translate(-50%,-50%) scale(.58);
  background:
    radial-gradient(circle,
      rgba(199,231,174,.20) 0%,
      rgba(170,211,155,.10) 24%,
      rgba(114,164,126,.035) 47%,
      transparent 70%);
  filter:blur(22px);
}

#stage-final::after{
  content:"✦   ·   ✧   ·   ✦";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.9);
  color:rgba(220,239,202,.0);
  font-size:clamp(13px,1.3vw,20px);
  letter-spacing:1.9em;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  text-shadow:
    0 0 12px rgba(213,237,194,.28),
    0 0 28px rgba(184,222,166,.18);
}

/* Keep Claude's layout, but give the ending its own readable width.
   display:grid + both phases sharing grid-area 1/1 (same idiom already
   used for the letter's two faces) means phase1/phase2 overlap in
   exactly the same box instead of stacking in normal flow - swapping
   which one is visible never reflows or shifts the vertical centering,
   it's a pure opacity/blur crossfade in place. */
#stage-final .scene-text{
  position:relative;
  z-index:2;
  width:min(88vw,980px);
  margin-inline:auto;
  text-align:center;
  display:grid;
}
#stage-final .final-phase1,
#stage-final .final-phase2{
  grid-area:1/1;
}

/* PHASE 1 - the emotional message, exactly as before. Its own entrance
   animation (finalMessageReveal, below) is unchanged; .final-phase1 only
   adds the LATER fade-OUT when phase 2 takes over (Module 12) - see
   app.js's revealSignature(). */
#stage-final .final-phase1{
  transition:opacity 1.4s ease, filter 1.4s ease;
}
#stage-final .final-phase1.fade-out{
  opacity:0;
  filter:blur(14px);
  pointer-events:none;
}

#stage-final .final-message{
  margin:0;
  opacity:0;
  filter:blur(15px);
  transform:translateY(16px) scale(.985);
  color:#f6f4ed;
  text-wrap:balance;
  text-shadow:
    0 1px 0 rgba(0,0,0,.12),
    0 0 22px rgba(212,231,197,.08);
}
#stage-final .scene-text{
  transform:translateY(var(--nur-final-y));
}
#stage-final .final-message-main{
  font-size:var(--nur-final-font-size);
  font-weight:700;
  line-height:1.5;
  word-spacing:var(--nur-final-word-spacing);
  /* Independent vertical nudge (Module: "split the shared position
     control into separate top/bottom controls") - position:relative/top,
     deliberately NOT transform:translateY(), since the entrance
     animation below (finalMessageReveal) already animates transform on
     this same element and its 100% keyframe locks transform:translateY(0)
     in place once the animation finishes (fill-mode:both) - a second
     translateY here would just get silently overwritten. top is a
     completely different property, so it stacks cleanly with the
     animation instead of fighting it. Default 0px = no change from the
     existing look. */
  position:relative;
  top:var(--nur-final-main-y,0px);
}
#stage-final .final-message-sub{
  margin-top:22px;
  font-size:var(--nur-final-sub-font-size,clamp(18px,2vw,26px));
  font-weight:500;
  line-height:1.9;
  color:#eae8dd;
  word-spacing:var(--nur-final-word-spacing);
  /* Same technique as .final-message-main above - this is what actually
     lets the admin change the GAP between the two lines, since it moves
     independently of margin-top and of the entrance animation. */
  position:relative;
  top:var(--nur-final-sub-y,0px);
}

/* PHASE 2 - the credit line + socials. Starts invisible; app.js's
   revealSignature() adds .show once .final-phase1 has faded out, so the
   two never cross-dissolve into a muddy overlap - one clears, then the
   other arrives. The signature's own gentle twinkle keyframe runs
   continuously regardless (cheap, invisible until the parent reveals
   it) rather than being gated by a second class - one less moving part. */
#stage-final .final-phase2{
  opacity:0;
  filter:blur(10px);
  transition:opacity 1.6s ease, filter 1.6s ease;
  pointer-events:none;
}
#stage-final .final-phase2.show{
  opacity:1;
  filter:blur(0);
  pointer-events:auto;
}
#stage-final .final-signature{
  margin:0;
  margin-top:var(--nur-final-sig-y);
  opacity:.78;
  /* min() caps the credit line so a large admin-chosen size (Module 35 -
     the old 24px ceiling was raised considerably) can never overflow a
     narrow viewport - the vw cap only ever engages once the screen is too
     narrow to comfortably fit the chosen px size, never on desktop. */
  font-size:min(var(--nur-final-sig-font-size), 13vw);
  font-weight:500;
  color:#e8cf8a;
  text-shadow:0 0 10px rgba(232,207,138,.3);
  word-spacing:var(--nur-final-sig-word-spacing);
  animation:signatureTwinkle 6s ease-in-out infinite;
}
@keyframes signatureTwinkle{
  0%,100%{opacity:.78; text-shadow:0 0 8px rgba(232,207,138,.22)}
  50%{opacity:.95; text-shadow:0 0 14px rgba(232,207,138,.4)}
}

/* Social icons - hand-painted line-art PNGs (assets/icon-*.webp), white
   on transparent, tinted warm via CSS filter (no separate colored asset
   needed) to match the signature's gold. Deliberately no circle/pill
   background or border (Module 14) - just the mark itself, with a soft
   glow standing in for a "button" affordance and a slow independent
   breathing pulse so the row feels quietly alive, not static. An icon
   with no URL configured stays hidden (index.html's [hidden] default),
   never a dead link. */
#stage-final .final-socials{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  /* Real CSS `gap` (Module 39) - never per-icon margins - so all four
     icons are mathematically guaranteed to stay evenly spaced no matter
     what value the admin picks; flex-wrap+justify-center keeps the row
     centered as a whole even if it ever has to wrap on a very narrow
     screen. min() keeps a large chosen gap from overflowing a narrow
     viewport (Module 40). */
  gap:min(var(--nur-final-social-gap,30px), 9vw);
  margin-top:min(var(--nur-final-social-top-gap,40px), 10vh);
}
#stage-final .final-social{
  --float-dur:7s;
  display:block;
  width:var(--nur-final-social-size,30px);
  height:var(--nur-final-social-size,30px);
  filter:sepia(1) saturate(2.4) brightness(.92) hue-rotate(-8deg)
         drop-shadow(0 0 var(--nur-final-social-glow-blur,7px) var(--nur-final-social-glow-color,rgba(232,207,138,.35)));
  opacity:.82;
  animation:finalSocialBreathe var(--float-dur) ease-in-out infinite;
  transition:opacity .3s ease, filter .3s ease, transform .3s ease;
}
#stage-final .final-social[hidden]{display:none}
#stage-final .final-social img{width:100%; height:100%; display:block}
#stage-final .final-social:hover,
#stage-final .final-social:focus-visible{
  opacity:1;
  transform:translateY(-2px);
  filter:sepia(1) saturate(2.6) brightness(1.05) hue-rotate(-8deg)
         drop-shadow(0 0 var(--nur-final-social-glow-blur-hover,12px) var(--nur-final-social-glow-color-hover,rgba(232,207,138,.55)));
  outline:none;
}
@keyframes finalSocialBreathe{
  0%,100%{opacity:.78}
  50%{opacity:1}
}
@media (prefers-reduced-motion:reduce){
  #stage-final .final-social{animation:none}
}

/* Only runs when the existing app makes the final stage active. */
#stage-final.active::before{
  animation:finalLightBloom 4.8s cubic-bezier(.22,.75,.2,1) both;
}

#stage-final.active::after{
  animation:finalSparkle 5.2s ease both;
}

#stage-final.active .final-message{
  animation:finalMessageReveal 3.2s cubic-bezier(.2,.72,.18,1) .55s both;
}

@keyframes finalLightBloom{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.48);
    filter:blur(32px);
  }
  35%{
    opacity:.78;
  }
  72%{
    opacity:.42;
    transform:translate(-50%,-50%) scale(1.03);
    filter:blur(24px);
  }
  100%{
    opacity:.20;
    transform:translate(-50%,-50%) scale(1.12);
    filter:blur(28px);
  }
}

@keyframes finalSparkle{
  0%,14%{
    opacity:0;
    color:rgba(220,239,202,0);
    transform:translate(-50%,-50%) scale(.86);
  }
  40%{
    opacity:.72;
    color:rgba(220,239,202,.62);
  }
  68%{
    opacity:.28;
    transform:translate(-50%,-50%) scale(1.08);
  }
  100%{
    opacity:0;
    color:rgba(220,239,202,0);
    transform:translate(-50%,-50%) scale(1.16);
  }
}

@keyframes finalMessageReveal{
  0%{
    opacity:0;
    filter:blur(17px);
    transform:translateY(18px) scale(.98);
    letter-spacing:.025em;
  }
  42%{
    opacity:.72;
    filter:blur(4px);
  }
  100%{
    opacity:1;
    filter:blur(0);
    transform:translateY(0) scale(1);
    letter-spacing:0;
  }
}

@media (max-width:760px){
  #stage-final .scene-text{
    width:88vw;
  }
  #stage-final .final-message-main{
    font-size:clamp(22px,6vw,30px);
    line-height:1.45;
  }
  #stage-final .final-message-sub{
    margin-top:16px;
    font-size:clamp(16px,4.4vw,20px);
    line-height:1.8;
  }
  #stage-final .final-signature{
    margin-top:64px;
    font-size:13px;
  }
  #stage-final::after{
    letter-spacing:1.15em;
  }
}

/* Respect accessibility settings instead of forcing animation on everyone. */
@media (prefers-reduced-motion:reduce){
  #stage-final.active::before,
  #stage-final.active::after,
  #stage-final.active .final-message{
    animation-duration:.01ms !important;
    animation-delay:0ms !important;
  }
  #stage-final .final-phase1,
  #stage-final .final-phase2{
    transition-duration:.01ms;
  }
  #stage-final .final-signature{
    animation:none;
    opacity:.85;
  }
}
</style>


<style>
/* ===== Countdown polish only =====
   Scoped entirely to #stage-countdown so the rest of the project stays untouched. */

#stage-countdown{
  position:relative;
  isolation:isolate;
  overflow:hidden;
}

/* Controlled exit: app.js adds this class the instant the countdown
   reaches 1 and freezes the number - the stage stays fully active,
   centered and laid out exactly as before, and ONLY opacity/blur/scale
   animate. Only once this finishes does app.js hand off to the normal
   stage-swap (show()), so the final stage never enters while this is
   still visible and the number never has a frame without full centering. */
#stage-countdown.exiting{
  animation:countdownExit 900ms ease forwards;
}
@keyframes countdownExit{
  from{opacity:1; filter:blur(0); transform:scale(1)}
  to{opacity:0; filter:blur(20px); transform:scale(.97)}
}
@media (prefers-reduced-motion:reduce){
  #stage-countdown.exiting{
    animation-duration:.01ms;
  }
}

/* Wide, very soft magical aura */
#stage-countdown::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:min(64vw,720px);
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.78);
  pointer-events:none;
  z-index:-2;
  opacity:0;
  background:
    radial-gradient(circle,
      rgba(202,232,177,.16) 0%,
      rgba(164,210,160,.075) 27%,
      rgba(108,162,140,.025) 51%,
      transparent 72%);
  filter:blur(22px);
}

/* Thin orbit / ripple around the number */
#stage-countdown::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:clamp(210px,25vw,330px);
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.70);
  pointer-events:none;
  z-index:-1;
  opacity:0;
  border:1px solid rgba(218,239,196,.18);
  box-shadow:
    0 0 26px rgba(196,229,175,.08),
    inset 0 0 28px rgba(196,229,175,.035);
}

#stage-countdown.active::before{
  animation:countdownAura 4.8s ease-in-out infinite;
}

#stage-countdown.active::after{
  animation:countdownOrbit 3.7s cubic-bezier(.4,0,.2,1) infinite;
}

/* Reuse Claude's existing glow element as a tiny living star */
#stage-countdown .countdown-glow{
  position:absolute !important;
  left:50% !important;
  top:50% !important;
  width:12px !important;
  height:12px !important;
  margin:0 !important;
  border-radius:50%;
  transform:translate(-50%,-50%) translateY(-112px);
  background:#e3f2cb !important;
  opacity:.48;
  filter:blur(.2px);
  box-shadow:
    0 0 8px rgba(228,246,207,.72),
    0 0 22px rgba(196,231,177,.42),
    0 0 52px rgba(159,210,158,.17);
  pointer-events:none;
  z-index:0;
}

#stage-countdown.active .countdown-glow{
  animation:countdownStar 3.2s ease-in-out infinite;
}

/* Main number: intentionally much larger and more important */
#stage-countdown .countdown-number{
  position:relative;
  z-index:2;
  min-width:2.4ch;
  text-align:center;
  font-size:clamp(108px,12vw,184px) !important;
  line-height:.92 !important;
  font-weight:600 !important;
  letter-spacing:-.055em;
  font-variant-numeric:tabular-nums;
  color:#f5f3e8 !important;
  text-shadow:
    0 0 20px rgba(231,244,216,.11),
    0 0 52px rgba(179,219,164,.075);
  transform-origin:center;
  will-change:transform,opacity,filter;
}

/* Re-triggered by the tiny JS observer whenever the digit changes */
#stage-countdown .countdown-number.tick-magic{
  animation:magicalTick .82s cubic-bezier(.19,.78,.22,1) both;
}

#stage-countdown .countdown-label{
  position:relative;
  z-index:2;
  margin-top:26px !important;
  font-size:clamp(20px,1.8vw,29px) !important;
  line-height:1.5 !important;
  font-weight:500 !important;
  color:rgba(238,241,232,.74) !important;
  letter-spacing:.01em;
  text-shadow:0 0 18px rgba(202,228,184,.07);
}

/* Reserve a fixed-width slot for the dots so "در حال ارسال" itself never
   shifts as they cycle - only the dots grow/shrink inside this slot,
   right-aligned within it so they always sit flush against the phrase
   (its RTL-isolated sibling) and grow away from it. */
#stage-countdown .countdown-dots{
  display:inline-block;
  min-width:1.6em;
  text-align:right;
}

#stage-countdown.active .countdown-label{
  animation:labelBreath 3.2s ease-in-out infinite;
}

@keyframes magicalTick{
  0%{
    opacity:.18;
    filter:blur(13px);
    transform:translateY(8px) scale(.86);
    text-shadow:
      0 0 10px rgba(236,248,222,.10),
      0 0 22px rgba(184,226,168,.06);
  }
  32%{
    opacity:.92;
    filter:blur(2.5px);
    transform:translateY(-2px) scale(1.075);
    text-shadow:
      0 0 26px rgba(235,248,216,.22),
      0 0 68px rgba(177,221,161,.16);
  }
  62%{
    opacity:1;
    filter:blur(0);
    transform:translateY(0) scale(1.025);
  }
  100%{
    opacity:1;
    filter:blur(0);
    transform:translateY(0) scale(1);
  }
}

@keyframes countdownAura{
  0%,100%{
    opacity:.22;
    transform:translate(-50%,-50%) scale(.76);
    filter:blur(27px);
  }
  50%{
    opacity:.65;
    transform:translate(-50%,-50%) scale(1.02);
    filter:blur(20px);
  }
}

@keyframes countdownOrbit{
  0%{
    opacity:.08;
    transform:translate(-50%,-50%) scale(.72);
  }
  47%{
    opacity:.40;
    transform:translate(-50%,-50%) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.17);
  }
}

@keyframes countdownStar{
  0%,100%{
    opacity:.28;
    transform:translate(-50%,-50%) translateY(-112px) scale(.68);
  }
  50%{
    opacity:.92;
    transform:translate(-50%,-50%) translateY(-112px) scale(1.18);
  }
}

@keyframes labelBreath{
  0%,100%{opacity:.60}
  50%{opacity:.88}
}

@media (max-width:760px){
  #stage-countdown .countdown-number{
    font-size:clamp(92px,28vw,142px) !important;
  }
  #stage-countdown .countdown-label{
    margin-top:22px !important;
    font-size:clamp(18px,5vw,24px) !important;
  }
  #stage-countdown::after{
    width:clamp(190px,58vw,280px);
  }
  #stage-countdown .countdown-glow{
    transform:translate(-50%,-50%) translateY(-92px);
  }
  #stage-countdown.active .countdown-glow{
    animation:countdownStarMobile 3.2s ease-in-out infinite;
  }
}

@keyframes countdownStarMobile{
  0%,100%{
    opacity:.28;
    transform:translate(-50%,-50%) translateY(-92px) scale(.68);
  }
  50%{
    opacity:.92;
    transform:translate(-50%,-50%) translateY(-92px) scale(1.18);
  }
}

@media (prefers-reduced-motion:reduce){
  #stage-countdown.active::before,
  #stage-countdown.active::after,
  #stage-countdown.active .countdown-glow,
  #stage-countdown.active .countdown-label,
  #stage-countdown .countdown-number.tick-magic{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }
}
</style>

</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>
<div class="nur-pulse-overlay" aria-hidden="true"></div>

<main class="wrap">

  <!-- 1. INTRO -->
  <section class="stage" id="stage-intro" data-stage>
    <div class="scene-text">
      <p class="greeting">درود <bdi class="handle" id="introHandle"></bdi></p>
      <div class="scene-body" id="introBody"></div>
    </div>
    <div class="scene-actions">
      <button class="btn btn-primary" id="toBeforeOpen">ادامه می‌دم</button>
      <button class="btn btn-ghost" id="toLeaving">رهاش می‌کنم</button>
    </div>
  </section>

  <!-- LEAVING (soft ending) -->
  <section class="stage" id="stage-leaving" data-stage>
    <div class="scene-text">
      <p>مراقب خودت باش، موفق باشی.</p>
    </div>
  </section>

  <!-- 2. BEFORE OPENING -->
  <section class="stage" id="stage-before-open" data-stage>
    <div class="scene-text small">
      <p class="greeting" id="envelopeGreeting"></p>
      <p id="envelopeInstruction"></p>
    </div>
    <div class="floating-scene" id="openEnvelope" role="button" tabindex="0" aria-label="باز کردن نامه">
      <img class="envelope-img" data-src="assets/envelope.webp" width="1448" height="1086" decoding="async" alt="پاکت نامه دست‌ساز دال‌وی">
    </div>
  </section>

  <!-- 3 / 4 / 5. THE LETTER (three baked pages, one physical card, soft crossfade between them) -->
  <section class="stage" id="stage-letter" data-stage>
    <div class="letter-stage-inner">
      <div class="letter-flipper" id="letterFlipper" data-active="1">
        <div class="letter-face page1">
          <img class="note-img" id="notePage1Img" data-default-src="assets/note-page1.webp" width="653" height="1080" decoding="async" alt="نامه - صفحه ۱">
          <div class="note-field field-name-overlay" id="letterNameOverlay"></div>
          <div class="note-field letter-body" id="letterBody1"></div>
          <div class="note-field letter-signature" id="letterSignature1"></div>
          <div class="note-field letter-pagenum" id="letterPageNum1"></div>
          <button class="note-next-btn" id="toPage2">صفحه‌ی بعد</button>
        </div>
        <div class="letter-face page2">
          <img class="note-img" id="notePage2Img" data-default-src="assets/note-page2.webp" width="653" height="1080" decoding="async" alt="نامه - صفحه ۲">
          <div class="note-field letter-body" id="letterBody2"></div>
          <div class="note-field letter-signature" id="letterSignature2"></div>
          <div class="note-field letter-pagenum" id="letterPageNum2"></div>
          <button class="note-next-btn" id="toPage3">صفحه‌ی بعد</button>
        </div>
        <div class="letter-face page3">
          <img class="note-img" id="notePage3Img" data-default-src="assets/note-page3.webp" width="653" height="1080" decoding="async" alt="نامه - صفحه ۳">
          <div class="note-field letter-body" id="letterBody3"></div>
          <div class="note-field letter-signature" id="letterSignature3"></div>
          <div class="note-field letter-pagenum" id="letterPageNum3"></div>
          <button class="note-next-btn" id="toCountdown">دریافت نور</button>
        </div>
      </div>
    </div>
  </section>

  <!-- COUNTDOWN — the light being sent -->
  <section class="stage" id="stage-countdown" data-stage>
    <div class="countdown-glow" aria-hidden="true"></div>
    <div class="countdown-number" id="countdownNumber">30</div>
    <div class="countdown-label"><bdi>در حال ارسال</bdi><bdi class="countdown-dots" id="countdownDots" aria-hidden="true"></bdi></div>
  </section>

  <!-- PROJECTOR / MEMORY — optional, only shown when config.projector.enabled
       is true (see app.js). Never receives any media until app.js actually
       calls NUR_PROJECTOR.start(), so this markup alone costs nothing when
       the feature is off. -->
  <section class="stage" id="stage-projector" data-stage>
    <p class="proj-title" id="projTitle"></p>
    <figure class="memory-frame" id="memoryFrame">
      <div class="frame-media">
        <div class="media-layer" data-layer="0"></div>
        <div class="media-layer" data-layer="1"></div>
        <!-- Poster/cover (config.projector.poster) - same crop/fit/
             position as the eventual video (.media-fg), shown from the
             moment the frame enters so there is never a blank/white
             interior before playback. Fades out (not removed) the
             instant real media reveals - see projector.js's hidePoster()
             and reveal(). Hidden entirely (not just empty) when no
             poster is configured, falling back to .frame-media's own
             warm parchment background color. -->
        <img class="proj-poster" id="projPoster" alt="" hidden>
        <!-- YouTube mode target (config.projector.source === "youtube") -
             projector.js creates a YT.Player against the INNER mount div
             only when that source is active and the iframe API has been
             lazy-loaded (Module 17: never for Uploaded Media viewers).
             Same inset/position as the video slot so it sits inside the
             same mask/crop area.
             Two nested elements, deliberately - YT.Player REPLACES
             whatever element you hand it with its own <iframe> (same id,
             different node), so a cached reference to that element goes
             stale the instant the player is created. Confirmed as the
             actual cause of a real bug: code that later tried to hide
             "#projYouTube" was silently updating an orphaned, detached
             node - the real, visible iframe (which inherited the same id)
             could never be hidden again after the first play, so it
             stayed on screen indefinitely, stacking on top of whatever
             played next. The OUTER wrapper (#projYouTubeFrame) is what
             every show/hide toggle now targets - it is never touched or
             replaced by YT, so it stays a stable reference. Only the
             INNER mount (#projYouTube) is ever handed to `new YT.Player`. -->
        <div class="proj-youtube" id="projYouTubeFrame" hidden>
          <div id="projYouTube"></div>
        </div>
        <div class="projector-vignette"></div>
        <div class="proj-ambient-glow" aria-hidden="true"></div>
        <svg class="vhs-layer vhs-grain-layer" aria-hidden="true" focusable="false">
          <filter id="vhsGrainFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="21" result="n"/>
            <feColorMatrix in="n" type="saturate" values="0"/>
          </filter>
          <rect width="100%" height="100%" filter="url(#vhsGrainFilter)"/>
        </svg>
        <svg class="vhs-layer vhs-noise-layer" aria-hidden="true" focusable="false">
          <filter id="vhsNoiseFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.12 0.9" numOctaves="2" seed="77" result="n"/>
            <feColorMatrix in="n" type="saturate" values="0"/>
          </filter>
          <rect width="100%" height="100%" filter="url(#vhsNoiseFilter)"/>
        </svg>
        <svg class="vhs-layer vhs-dust-layer" aria-hidden="true" focusable="false">
          <filter id="vhsDustFilter" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="133" result="n"/>
            <feColorMatrix in="n" type="saturate" values="0" result="gray"/>
            <feComponentTransfer in="gray">
              <feFuncA type="discrete" tableValues="0 0 0 0 0 0 0 1"/>
            </feComponentTransfer>
          </filter>
          <rect width="100%" height="100%" filter="url(#vhsDustFilter)"/>
        </svg>
        <div class="vhs-vignette-layer"></div>
        <!-- Single state-driven overlay (projector.js's state machine) -
             preplay / loading / stalled / ended-waiting-for-manual-continue
             all live here as one element instead of scattered buttons, so
             there is exactly one place that can go stale and exactly one
             stacking problem to get right (see projector.css). -->
        <div class="proj-gate" id="projGate">
          <p class="proj-gate-text" id="projGateText"></p>
          <button type="button" class="proj-gate-btn" id="projPlayBtn"></button>
          <div class="proj-gate-actions" id="projGateActions">
            <button type="button" class="proj-action-btn" id="projRetryBtn">دوباره تلاش کن</button>
            <button type="button" class="proj-action-btn" id="projSkipBtn">ادامه بدون فیلم</button>
          </div>
          <!-- The calm, indefinite-wait reaction state after the memory
               finishes - deliberately no headline copy here, just the
               quiet action once the hold ends (see projector.js).
               Continue/"صفحه بعد" USED to live here too, but it now lives
               entirely outside the frame (see #projContinueBtn below) -
               only Replay stays inside, centered, alone. -->
          <div class="proj-gate-actions proj-gate-actions--ended" id="projEndedActions">
            <button type="button" class="proj-action-btn" id="projReplayBtn">پخش دوباره</button>
          </div>
        </div>
      </div>
      <!-- Audio reminder/fallback (projector.js's showAudioReminder()/
           showAudioFallbackAction()) - a SIBLING of .frame-media, NOT a
           child of it. .frame-media has the torn-paper CSS mask applied
           to itself (memory-frame-mask.png), which also clips every
           descendant - a corner badge placed literally inside it would
           sit right where the deckled edge is masked to transparent.
           Living on the frame border instead (like the tape/flower
           decorations already do) keeps it always visible, and it still
           needs to show DURING active playback, exactly when .proj-gate
           itself is hidden. -->
      <button type="button" class="proj-audio-hint" id="projAudioHint">
        <span class="proj-audio-hint-icon" aria-hidden="true">🔊</span>
        <span class="proj-audio-hint-text" id="projAudioHintText"></span>
      </button>
      <img class="frame-overlay" id="projFrameOverlay" alt="">
    </figure>
    <!-- "صفحه بعد" / Continue - lives completely OUTSIDE the frame, below
         it, reusing the exact same .note-next-btn component the letter
         pages already use ("صفحه‌ی بعد"/"دریافت نور") instead of a new
         one-off style. Positioned relative to the STAGE's own center
         (like .proj-caption above/.proj-title below - see projector.css)
         rather than sitting in normal document flow, which is what
         previously made an in-flow version of this exact button render
         BEHIND the frame (positioned siblings always paint above
         non-positioned in-flow ones, regardless of DOM order). hidden by
         default - projector.js's showEndedGate()/resetToEntry() toggle
         it exactly like every other gate control, only now independent
         of .proj-gate's own opacity fade. -->
    <button type="button" class="note-next-btn proj-next-btn" id="projContinueBtn">ادامه</button>
    <p class="proj-caption" id="projCaption"></p>
    <!-- Editor-only badge (Module 28) - text/visibility set exclusively by
         projector.js's previewState(), which is only ever called from the
         admin panel's State Preview buttons. A real visitor's code path
         never calls previewState(), so this never appears for them. -->
    <p class="proj-preview-badge" id="projPreviewBadge" aria-hidden="true"></p>
  </section>

  <!-- FINAL — two text phases sharing one stable background (see
       styles.css's .final-phase1/.final-phase2 and app.js's
       revealSignature()). Only this inner text ever crossfades; the
       night-sky bloom/sparkle behind it plays once on stage entry and is
       never re-triggered by the phase swap. -->
  <section class="stage" id="stage-final" data-stage>
    <div class="scene-text">
      <div class="final-phase1" id="finalPhase1">
        <p class="final-message final-message-main" id="finalMain"></p>
        <p class="final-message final-message-sub" id="finalSub"></p>
      </div>
      <div class="final-phase2" id="finalPhase2">
        <p class="final-signature" id="finalSignature"></p>
        <nav class="final-socials" id="finalSocials" aria-label="شبکه‌های اجتماعی">
          <a class="final-social" id="finalSocialKick" href="#" target="_blank" rel="noopener noreferrer" hidden aria-label="Kick">
            <img src="assets/icon-kick.webp" alt="">
          </a>
          <a class="final-social" id="finalSocialInstagram" href="#" target="_blank" rel="noopener noreferrer" hidden aria-label="Instagram">
            <img src="assets/icon-instagram.webp" alt="">
          </a>
          <a class="final-social" id="finalSocialYoutube" href="#" target="_blank" rel="noopener noreferrer" hidden aria-label="YouTube">
            <img src="assets/icon-youtube.webp" alt="">
          </a>
          <a class="final-social" id="finalSocialTelegram" href="#" target="_blank" rel="noopener noreferrer" hidden aria-label="Telegram">
            <img src="assets/icon-telegram.webp" alt="">
          </a>
        </nav>
      </div>
    </div>
  </section>

</main>

<script src="projector.js?v=20260917-7"></script>
